<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C2D7"/>
      <stop offset="50%" stop-color="#F6E7A1"/>
      <stop offset="100%" stop-color="#800020"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="240" r="110" fill="#FFFDF8" opacity="0.3"/>
  <circle cx="300" cy="240" r="85" fill="#FFFDF8" opacity="0.5"/>
  <!-- Romantic Sunset & Heart Art -->
  <path d="M300 320 C270 290 200 240 200 180 C200 130 240 100 280 120 C300 130 300 150 300 150 C300 150 300 130 320 120 C360 100 400 130 400 180 C400 240 330 290 300 320 Z" fill="#800020" opacity="0.85" filter="url(#glow)"/>
  <!-- Sparkles -->
  <path d="M300 70 L305 85 L320 90 L305 95 L300 110 L295 95 L280 90 L295 85 Z" fill="#F6E7A1"/>
  <path d="M160 160 L163 172 L175 175 L163 178 L160 190 L157 178 L145 175 L157 172 Z" fill="#FFFDF8"/>
  <path d="M440 170 L443 182 L455 185 L443 188 L440 200 L437 188 L425 185 L437 182 Z" fill="#FFFDF8"/>
  <!-- Camera / Add photo hint -->
  <rect x="180" y="380" width="240" height="130" rx="20" fill="#FFFDF8" opacity="0.9"/>
  <circle cx="300" cy="430" r="24" fill="#800020"/>
  <circle cx="300" cy="430" r="12" fill="#F4C2D7"/>
  <rect x="250" y="395" width="20" height="10" rx="3" fill="#800020"/>
  <text x="300" y="485" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#800020" text-anchor="middle">Photo 1</text>
  <text x="300" y="502" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#654321" text-anchor="middle">(Replace with: photo1.jpg)</text>
</svg>